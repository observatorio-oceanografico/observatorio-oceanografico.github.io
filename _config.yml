title: Observatório Oceanográfico
description: Laboratório interdisciplinar da UFF dedicado às ciências do mar, mudanças climáticas e tecnologias ambientais
baseurl: ""
url: https://observatoriooceanografico.org

collections:
  pages:
    output: true
  people:
    output: true
  projects:
    output: true
  resources:
    output: true
    permalink: /recursos/:name/
  redirects:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

  - scope:
      type: projects
    values:
      layout: single

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclui o README.md do build: evita que o jekyll-readme-index o publique como "/"
# (a home vem de _pages/pt/index.md). O arquivo continua versionado e visivel no GitHub.
exclude:
  - README.md
  - CONTRIBUTING.md
  - NEWS-URL-MIGRATION.md
  - gitattributes
  - utils/
  - assets/downloads/README.md
  - assets/downloads/README_VSCODE.md
  - assets/downloads/instrucoes-bio-equipe.md
