# =============================================================
# CLASSIFICAÇÃO DE GRUPOS — página oficial de Equipe
# (/sobre/equipe/, /en/about/team/)
# =============================================================
#
# Este arquivo NÃO faz parte do schema de _people/. É uma camada
# adicional, usada pela página oficial de Equipe para organizar os
# perfis em grupos visuais, sem alterar o front matter dos perfis
# existentes.
#
# Também é usado, por enquanto, pelas rotas experimentais
# /pessoas-beta/ e /en/people-beta/ (mesma fonte de dados, mesmo
# resultado — essas rotas devem ser removidas em uma etapa futura).
#
# Chave  = valor do campo `slug` em _people/<slug>.pt.md / .en.md
# Valor  = grupo, um de:
#   andre           — André Belém
#   friday          — F.R.I.D.A.Y.
#   senior          — "Pesquisadores seniores e colaboradores": papel
#                      científico ou colaborativo de grande destaque na
#                      rede do Observatório, interno ou externo. Ordem
#                      curatorial, não segue o `order` do perfil — ver
#                      `senior_order` mais abaixo.
#   pesquisadores   — "Pesquisadores e pós-graduação": demais
#                      pesquisadores, pós-docs, doutorandos e
#                      mestrandos que não estejam no grupo `senior`.
#                      Ordenado pelo `order` já existente do perfil.
#   estudantes      — graduação / iniciação científica
#   extensao        — extensão, cultura oceânica, comunicação
#
# Quem não aparecer aqui cai automaticamente na seção "Outros",
# para nunca desaparecer silenciosamente.
#
# Alumni (ex.: Pedro Guedes, Rafael Ribeiro) NÃO entram neste arquivo:
# a página de Equipe não lista ex-membros, só linka para /sobre/alumni/.
#
# Deve ser revisto quando (e se) o schema de _people/ ganhar um campo
# oficial de grupo/categoria/vínculo.

andre-belem: andre
friday-bot: friday

luciano-rapagna: senior
bernardo-chede: senior

