# -------------------------------------------------------------
# Ordem curatorial do grupo "senior" (Pesquisadores seniores e
# colaboradores). Esta lista PREVALECE sobre o `order` do perfil
# para este grupo específico — as demais seções continuam usando
# o `order` normal de _people/.
#
# "jonas" é um slug reservado/placeholder: Jonas (CMCC / Itália)
# ainda NÃO tem perfil em _people/. Ele não é criado nesta etapa
# (sem placeholder, sem card vazio). A página simplesmente ignora
# entradas de senior_order sem perfil correspondente em site.people.
#
# Quando o perfil de Jonas for criado em _people/ com slug "jonas"
# (e adicionado ao mapeamento acima como `jonas: senior`), ele
# passará a aparecer automaticamente em primeiro lugar neste grupo,
# sem precisar tocar no template. Se o slug real escolhido for
# diferente de "jonas", atualize a entrada abaixo para o slug certo.
# -------------------------------------------------------------
senior_order:
  - jonas
  - luciano-rapagna
  - bernardo-chede
