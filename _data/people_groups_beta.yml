# Este arquivo NÃO faz parte do schema de _people/. É uma camada
# adicional, só usada pela página experimental de Pessoas, para
# testar uma organização visual por grupos sem alterar o front
# matter dos perfis existentes.
#
# Chave  = valor do campo `slug` em _people/<slug>.pt.md / .en.md
# Valor  = grupo experimental, um de:
#   andre           — André Belém
#   friday          — F.R.I.D.A.Y.
#   colaboradores   — colaboradores/parceiros externos ao O2/UFF
#   pesquisadores   — pesquisadores, pós-doutorado e pós-graduação
#                      (doutorado/mestrado)
#   estudantes      — graduação / iniciação científica
#   extensao        — bolsistas de extensão, cultura oceânica e
#                      difusão/comunicação científica
#
# Critério usado nesta primeira rodada (heurístico, não oficial):
# combinação de `role` + `affiliation` de cada perfil em _people/.
# Quem não aparecer aqui cai automaticamente na seção "Outros"
# da página experimental, para nunca desaparecer silenciosamente.
#
# Isso é experimental e deve ser revisto quando (e se) o schema de
# _people/ ganhar um campo oficial de grupo/categoria/vínculo.

